<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Hero - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .error {
            color: #f44336;
            text-align: center;
            margin: 10px 0;
            font-size: 14px;
        }

        .users-list {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .users-list h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .user-item {
            padding: 10px;
            margin: 5px 0;
            background: #f5f5f5;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .user-item:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⌨️ Typing Hero</h1>
        
        <div id="loginForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="nickname">Nickname</label>
                <input type="text" id="nickname" placeholder="Enter your nickname">
            </div>
            <button class="btn btn-primary" id="loginBtn">Sign In</button>
            <div class="error" id="error"></div>
            <div class="links">
                <a href="/">Back to Game</a>
            </div>
        </div>

        <div class="users-list" id="usersList">
            <h3>Registered Users</h3>
            <div id="usersContainer"></div>
        </div>
    </div>

    <script>
        const nameInput = document.getElementById('name');
        const nicknameInput = document.getElementById('nickname');
        const loginBtn = document.getElementById('loginBtn');
        const errorDiv = document.getElementById('error');
        const usersContainer = document.getElementById('usersContainer');

        // Load existing users
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                if (response.ok) {
                    const users = await response.json();
                    displayUsers(users);
                }
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        function displayUsers(users) {
            usersContainer.innerHTML = '';
            if (users.length === 0) {
                usersContainer.innerHTML = '<div class="user-item">No users registered yet</div>';
                return;
            }

            users.forEach(user => {
                const userElement = document.createElement('div');
                userElement.className = 'user-item';
                userElement.textContent = `${user.name} (@${user.nickname})`;
                userElement.addEventListener('click', () => {
                    nameInput.value = user.name;
                    nicknameInput.value = user.nickname;
                });
                usersContainer.appendChild(userElement);
            });
        }

        loginBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            const nickname = nicknameInput.value.trim();

            if (!name || !nickname) {
                errorDiv.textContent = 'Please enter both name and nickname';
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, nickname })
                });

                if (response.ok) {
                    const userData = await response.json();
                    // Store user data in localStorage
                    localStorage.setItem('currentUser', JSON.stringify(userData));
                    // Set cookie for server-side authentication
                    document.cookie = `currentUser=${JSON.stringify(userData)}; path=/; max-age=3600`;
                    // Redirect to game
                    window.location.href = '/';
                } else {
                    const error = await response.json();
                    errorDiv.textContent = error.message || 'Login failed';
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                console.error('Login error:', error);
            }
        });

        // Load users when page loads
        loadUsers();
    </script>
</body>
</html>
